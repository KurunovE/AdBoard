<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to AdBoard</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f7fb;font-family:Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f7fb;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;">
                <tr>
                    <td style="background:#111827;padding:28px 32px;color:#ffffff;">
                        <h1 style="margin:0;font-size:28px;line-height:1.2;">Welcome to AdBoard</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <p style="margin:0 0 16px;font-size:18px;line-height:1.6;">
                            Hello, <strong th:text="${name}">User</strong>!
                        </p>
                        <p style="margin:0 0 16px;font-size:16px;line-height:1.7;">
                            Your registration in AdBoard was successful.
                        </p>
                        <p style="margin:0;font-size:16px;line-height:1.7;">
                            Best regards,<br>
                            AdBoard team
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
