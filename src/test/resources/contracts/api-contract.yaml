openapi: 3.0.3
info:
  title: AdBoard API Contract
  version: 1.0.0
  description: Full API contract for manual, integration, and contract testing.

servers:
  - url: http://localhost:8081

tags:
  - name: Auth
  - name: Advertisements
  - name: Categories
  - name: Comments
  - name: Images
  - name: Users

paths:
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseRegistration'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '503':
          description: Dependent service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '503':
          description: Dependent service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid refresh token or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '503':
          description: Dependent service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logout successful
        '400':
          description: Invalid refresh token or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '503':
          description: Dependent service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements:
    get:
      tags: [Advertisements]
      summary: Get advertisements
      operationId: getAdvertisements
      parameters:
        - in: query
          name: categoryId
          schema:
            type: integer
            format: int64
        - in: query
          name: authorId
          schema:
            type: integer
            format: int64
        - in: query
          name: minPrice
          schema:
            type: number
            format: double
        - in: query
          name: maxPrice
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Advertisements returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdvertisementResponse'
        '400':
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements/{id}:
    get:
      tags: [Advertisements]
      summary: Get advertisement by id
      operationId: getAdvertisementById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Advertisement returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementResponse'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Advertisement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
    put:
      tags: [Advertisements]
      summary: Update advertisement
      operationId: updateAdvertisement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvertisementUpdateRequest'
      responses:
        '200':
          description: Advertisement updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Advertisement or category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
    delete:
      tags: [Advertisements]
      summary: Delete advertisement
      operationId: deleteAdvertisement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Advertisement deleted
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Advertisement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements/create:
    post:
      tags: [Advertisements]
      summary: Create advertisement
      operationId: createAdvertisement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvertisementCreateRequest'
      responses:
        '200':
          description: Advertisement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements/{id}/status:
    patch:
      tags: [Advertisements]
      summary: Change advertisement status
      operationId: changeAdvertisementStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvertisementStatusUpdateRequest'
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Advertisement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/categories:
    get:
      tags: [Categories]
      summary: Get all categories
      operationId: getCategories
      responses:
        '200':
          description: Categories returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

  /v1/categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by id
      operationId: getCategoryById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Category returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
    put:
      tags: [Categories]
      summary: Update category
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
    delete:
      tags: [Categories]
      summary: Delete category
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Category deleted
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/categories/create:
    post:
      tags: [Categories]
      summary: Create category
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements/{advertisementId}/comments:
    get:
      tags: [Comments]
      summary: Get comments for advertisement
      operationId: getCommentsByAdvertisementId
      parameters:
        - $ref: '#/components/parameters/AdvertisementIdPath'
      responses:
        '200':
          description: Comments returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Advertisement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements/{advertisementId}/comments/create:
    post:
      tags: [Comments]
      summary: Create comment
      operationId: createComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdvertisementIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Advertisement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements/{advertisementId}/comments/{id}:
    delete:
      tags: [Comments]
      summary: Delete comment
      operationId: deleteComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdvertisementIdPath'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Comment deleted
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements/{advertisementId}/images:
    get:
      tags: [Images]
      summary: Get advertisement images
      operationId: getAdvertisementImages
      parameters:
        - $ref: '#/components/parameters/AdvertisementIdPath'
      responses:
        '200':
          description: Images returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageResponse'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Advertisement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements/{advertisementId}/images/upload:
    post:
      tags: [Images]
      summary: Upload image for advertisement
      operationId: uploadImage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdvertisementIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400':
          description: Invalid multipart request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Advertisement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/advertisements/{advertisementId}/images/{id}:
    delete:
      tags: [Images]
      summary: Delete image
      operationId: deleteImage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdvertisementIdPath'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Image deleted
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

  /v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user by id
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
    put:
      tags: [Users]
      summary: Update user
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
    delete:
      tags: [Users]
      summary: Delete user
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: User deleted
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    AdvertisementIdPath:
      in: path
      name: advertisementId
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0

  schemas:
    UserRegistrationRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name:
          type: string
          minLength: 1
          example: Ivan Ivanov
        email:
          type: string
          format: email
          example: ivan@example.com
        phone:
          type: string
          minLength: 1
          example: "+79990000000"
        password:
          type: string
          minLength: 1
          example: secret

    UserResponseRegistration:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Ivan Ivanov
        email:
          type: string
          format: email
          example: ivan@example.com
        phone:
          type: string
          example: "+79990000000"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ivan@example.com
        password:
          type: string
          minLength: 1
          example: secret

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          example: eyJhbGciOi...

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          example: eyJhbGciOi...

    LoginResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
        - refresh_expires_in
        - token_type
      properties:
        access_token:
          type: string
          example: eyJhbGciOi...
        refresh_token:
          type: string
          example: eyJhbGciOi...
        expires_in:
          type: integer
          format: int64
          example: 300
        refresh_expires_in:
          type: integer
          format: int64
          example: 1800
        token_type:
          type: string
          example: Bearer

    AdvertisementCreateRequest:
      type: object
      required: [title, price, categoryId]
      properties:
        title:
          type: string
          minLength: 1
          example: iPhone 14
        description:
          type: string
          nullable: true
          example: In good condition
        price:
          type: number
          format: double
          minimum: 0
          example: 50000
        categoryId:
          type: integer
          format: int64
          example: 1

    AdvertisementUpdateRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
          example: iPhone 14 Pro
        description:
          type: string
          nullable: true
          example: Updated description
        price:
          type: number
          format: double
          minimum: 1
          nullable: true
          example: 65000
        categoryId:
          type: integer
          format: int64
          nullable: true
          example: 2

    AdvertisementStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AdvertisementStatus'

    AdvertisementStatus:
      type: string
      enum: [ACTIVE, CLOSED]

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Smartphones
        parentId:
          type: integer
          format: int64
          nullable: true
          example: 1

    CategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 100
          example: Smartphones
        parentId:
          type: integer
          format: int64
          nullable: true
          example: 1

    CommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          example: Is this item still available?

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          example: Ivan Petrov
        phone:
          type: string
          nullable: true
          example: "+79991112233"

    AdvertisementResponse:
      type: object
      description: Advertisement payload without embedded images. Use /v1/advertisements/{advertisementId}/images to fetch images separately.
      properties:
        id:
          type: integer
          format: int64
        title:
